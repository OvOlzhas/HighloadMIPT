services:
  backend-1:
    build: .
    environment:
      INSTANCE_ID: backend-1
      REQUEST_LOGS: "${REQUEST_LOGS:-true}"
    ports:
      - "8081:8080"
    cpus: "1.0"

  backend-2:
    build: .
    environment:
      INSTANCE_ID: backend-2
      REQUEST_LOGS: "${REQUEST_LOGS:-true}"
    ports:
      - "8082:8080"
    cpus: "1.0"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend-1
      - backend-2
    ports:
      - "8080:80"
      - "127.0.0.1:8090:81"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/locations.conf:/etc/nginx/locations.conf:ro
      - nginx-cache:/var/cache/nginx

volumes:
  nginx-cache:

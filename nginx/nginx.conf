worker_processes 1;

events {
    worker_connections 4096;
}

http {
    log_format gateway '$remote_addr "$request" status=$status '
                       'upstream=$upstream_addr cache=$upstream_cache_status '
                       'request_time=$request_time';

    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log warn;

    proxy_cache_path /var/cache/nginx/history
                     levels=1:2
                     keys_zone=history_cache:10m
                     max_size=256m
                     inactive=60s
                     use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=5r/s;

    upstream backend_pool {
        server backend-1:8080;
        server backend-2:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        limit_req_status 429;
        limit_req zone=api_per_ip burst=5 nodelay;

        include /etc/nginx/locations.conf;
    }

    server {
        listen 81;
        server_name _;

        access_log off;

        include /etc/nginx/locations.conf;
    }
}
